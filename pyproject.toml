[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-skillhub"
version = "0.2.0"
description = "Internal registry, installer, exporter, validator, and catalog builder for portable AI skills."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Quant SkillHub maintainers"}]
dependencies = ["PyYAML>=6.0.2,<7", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
site = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7.7,<10"]
fastcsv = ["polars>=1.34,<2"]
ccr = ["polars>=1.34,<2"]
dev = ["pytest>=8.3,<10", "build>=1.2,<2", "mkdocs>=1.6,<2", "mkdocs-material>=9.7.7,<10", "polars>=1.34,<2", "openpyxl>=3.1,<4"]

[project.scripts]
skillhub = "skillhub.cli:main"

[tool.setuptools.packages.find]
include = ["skillhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
skillhub = ["profiles/**/*.yaml"]
