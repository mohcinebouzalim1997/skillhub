name: Deploy SkillHub marketplace

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packs/**"
      - "collections/**"
      - "stacks/**"
      - "agents/**"
      - "workflows/**"
      - "schemas/**"
      - "docs/**"
      - "overrides/**"
      - "skillhub/**"
      - "skillhub.config.yaml"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SkillHub + pinned site dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-site.txt
          pip install -e .

      - name: Validate registry
        run: skillhub validate

      - name: Build marketplace
        run: skillhub build-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
