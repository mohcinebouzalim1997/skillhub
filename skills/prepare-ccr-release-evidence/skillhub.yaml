schema_version: 1
id: prepare-ccr-release-evidence
version: 0.2.0
title: Prepare CCR Release Evidence
category: quant
subcategory: workflow-preparation
owner: ccr-quant
status: reviewed
verification:
  level: reviewed
  reviewed_by: SkillHub maintainers
  last_reviewed: "2026-09-30"
tags: [ccr, release, cvar, gcvar, backtesting, workflow, evidence, pr-forensics]
aliases: [prepare ccr release, validate ccr release data, ccr release evidence]
executable: true
runtime:
  python: '>=3.10'
entrypoints:
  default: scripts/prepare.py
permissions:
  filesystem: read-input-write-output
  network: optional-github-only
compatibility:
  github-copilot: full
  github-copilot-cli: full
  microsoft-copilot: compact-export
dependencies:
  commands: []
  python: []
  skills:
    - analyze-large-result-diff
    - backtesting-drilldown
recommended_dependencies:
  python:
    - polars>=1.34,<2
  commands:
    - gh
examples:
  - title: Prepare CVAR and GCVAR evidence
    command: skillhub run prepare-ccr-release-evidence -- --cvar cvar.csv --cvar-backtesting cvar-bt.csv --gcvar gcvar.csv --gcvar-backtesting gcvar-bt.csv --prod-ref release/26.9 --candidate-ref release/26.10 --output out/ccr-release
  - title: Prepare evidence and prefetch candidate PRs
    command: skillhub run prepare-ccr-release-evidence -- --cvar cvar.csv --gcvar gcvar.csv --prod-ref release/26.9 --candidate-ref release/26.10 --repo OWNER/REPO --with-prs --output out/ccr-release
