    command: skillhub run analyze-large-result-diff -- --profile cvar --input cvar.csv --output out/cvar --coverage 0.8
  - title: GCVAR with an overridden threshold
    command: skillhub run analyze-large-result-diff -- --profile gcvar --input gcvar.csv --output out/gcvar --threshold "EepeInEur Gap=25000"
